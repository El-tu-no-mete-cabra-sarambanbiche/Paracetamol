<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ParacetaBurgers | Inicio</title>
    <style>
      :root {
        --red: #d61f26;
        --red-dark: #a9141d;
        --yellow: #ffc72c;
        --cream: #fff8ef;
        --dark: #1e1e1e;
        --muted: #5d5d5d;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        background: linear-gradient(135deg, #fffaf3 0%, #ffe6b2 100%);
        color: var(--dark);
        min-height: 100vh;
        display: grid;
        place-items: center;
      }

      .welcome-box {
        width: min(900px, calc(100% - 32px));
        background: rgba(255, 255, 255, 0.92);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 28px;
        box-shadow: 0 24px 60px rgba(30, 30, 30, 0.12);
        padding: 48px 32px;
        text-align: center;
      }

      .logo {
        width: 88px;
        height: 88px;
        border-radius: 50%;
        margin: 0 auto 18px;
        background: radial-gradient(circle at center, #ffe38a 0%, var(--yellow) 35%, var(--red) 100%);
        position: relative;
        box-shadow: inset 0 4px 5px rgba(255,255,255,0.5), 0 12px 24px rgba(214,31,38,0.2);
      }

      .logo::before {
        content: "P";
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        color: #fff;
        font-size: 2.3rem;
        font-weight: 900;
      }

      h1 {
        margin: 0;
        font-size: clamp(2.2rem, 5vw, 4rem);
        letter-spacing: -0.05em;
      }

      .subtitle {
        margin: 18px 0 30px;
        font-size: clamp(1.1rem, 2vw, 1.5rem);
        color: var(--muted);
      }

      .btn {
        display: inline-block;
        background: var(--red);
        color: #fff;
        padding: 16px 30px;
        border-radius: 999px;
        font-weight: 800;
        letter-spacing: 0.04em;
        box-shadow: 0 12px 24px rgba(214, 31, 38, 0.25);
        transition: transform 0.2s ease;
      }

      .btn:hover {
        transform: translateY(-2px);
      }
    </style>
  </head>
  <body>
    <main class="welcome-box">
      <div class="logo" aria-label="Logo de ParacetaBurgers"></div>
      <h1>ParacetaBurgers</h1>
      <p class="subtitle">Bienvenido a nuestra experiencia de sabor y rapidez.</p>
      <a class="btn" href="index.html">Entrar a la página</a>
    </main>
  </body>
</html>
